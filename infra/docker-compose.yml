# n8n + Caddy for the dental AI receptionist.
#
# Image tag: docker.n8n.io/n8nio/n8n:2.39.5 is the current stable release on
# Docker Hub as of 2026-09-14 (n8n moved to 2.x; there is no maintained 1.x
# tag any more). Pin the tag, never use "latest". Bump it deliberately after
# reading the release notes, then re-run tests/red-team-calls.md.
#
# Postgres is NOT run here. n8n's own tables and the app tables (db/*.sql)
# both live on the RDS instance described in aws-setup.md.
#
# All values come from ./.env (copy .env.example). Never commit .env.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.5
    container_name: n8n
    restart: unless-stopped
    # Not published to the host. Caddy reaches it on the internal network.
    expose:
      - "5678"
    environment:
      # ---- Deployment (docs: use-environment-variables/deployment.md) ----
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}/
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PROXY_HOPS=1
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PUBLIC_API_DISABLED=true
      # ---- Security (docs: use-environment-variables/security.md) ----
      # N8N_BASIC_AUTH_* were removed from n8n in 1.0 and are not in the
      # current docs; n8n uses its own user accounts now. The variable is
      # kept so the value from PLAN.md section 3 is visible, but the real
      # HTTP gate for the editor is Caddy (basic_auth + IP allowlist in
      # ./Caddyfile) plus n8n login with MFA enforced.
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_SECURE_COOKIE=true
      - N8N_SAMESITE_COOKIE=lax
      - N8N_MFA_ENFORCED_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false   # workflows read the app vars below via $env
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # ---- Executions (docs: use-environment-variables/executions.md) ----
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168          # hours = 7 days
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_TIMEOUT=120
      # ---- Logs (docs: use-environment-variables/logs.md) ----
      - N8N_LOG_LEVEL=warn
      - N8N_LOG_OUTPUT=console
      - CODE_ENABLE_STDOUT=false
      # ---- Database on RDS (docs: use-environment-variables/database.md) ----
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_POOL_SIZE=4
      - DB_POSTGRESDB_SSL_ENABLED=true
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=true
      - DB_POSTGRESDB_SSL_CA=/certs/rds-global-bundle.pem
      # ---- Timezone ----
      - GENERIC_TIMEZONE=${PRACTICE_TZ}
      - TZ=${PRACTICE_TZ}
      # ---- Task runners (required for Code nodes on 2.x) ----
      - N8N_RUNNERS_ENABLED=true
      # ---- App variables read by the workflows ($env.NAME) ----
      - RETELL_API_KEY=${RETELL_API_KEY}
      - NEXHEALTH_API_KEY=${NEXHEALTH_API_KEY}
      - NEXHEALTH_SUBDOMAIN=${NEXHEALTH_SUBDOMAIN}
      - NEXHEALTH_LOCATION_DOWNTOWN=${NEXHEALTH_LOCATION_DOWNTOWN}
      - NEXHEALTH_LOCATION_NORTHSIDE=${NEXHEALTH_LOCATION_NORTHSIDE}
      - PATIENT_HASH_SALT=${PATIENT_HASH_SALT}
      - PRACTICE_TZ=${PRACTICE_TZ}
      - QUEUE_OWNER_EMAIL=${QUEUE_OWNER_EMAIL}
      - APPROVED_AGENTS_JSON=${APPROVED_AGENTS_JSON}
      - RETELL_SMS_AGENT_ID=${RETELL_SMS_AGENT_ID}
      - RETELL_OPTOUT_AGENT_ID=${RETELL_OPTOUT_AGENT_ID}
      # Code nodes in 01/08/10 use crypto (HMAC signature check); 11 reads APPROVED_AGENTS_JSON from disk.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs
    volumes:
      - n8n_data:/home/node/.n8n
      # Download once on the host:
      #   curl -o ./certs/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - ./certs/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.10.0
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"      # only for the ACME HTTP challenge and redirect to 443
      - "443:443"
      - "443:443/udp"
    environment:
      - N8N_HOST=${N8N_HOST}
      - CADDY_ADMIN_USER=${CADDY_ADMIN_USER}
      - CADDY_ADMIN_PASSWORD_HASH=${CADDY_ADMIN_PASSWORD_HASH}
      - ALLOWED_ADMIN_IPS=${ALLOWED_ADMIN_IPS}
      - RETELL_EGRESS_IP=${RETELL_EGRESS_IP}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      n8n:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
